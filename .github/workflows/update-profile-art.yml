name: Refresh Profile Art

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate ASCII Art & Cards
        run: |
          python scripts/prep_photo.py
          python scripts/make_ascii_svg.py
          python scripts/make_info_card.py
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg data/*.json source-prepped.png
          git commit -m "Chore: Daily refresh of profile art and contribution heatmap" || exit 0
          git push