name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: syedhassanstudies-rgb

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push origin HEAD:main
